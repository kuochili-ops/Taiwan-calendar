<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>𓃥 白六傳統手撕日曆</title>
  <style>
    :root {
      --ink: #0e3570;        /* 平日經典印刷藍 */
      --paper: #fcfbf6;      /* 傳統日曆紙色 */
      --paper-edge: #e6e2d3;
      --red-board: #d61c18;  /* 吊板大紅 */
      --gold-text: #f7d36f;  /* 吊板燙金字 */
    }

    body.is-red-day {
      --ink: #c81d18;        /* 週日與國定放假日自動切換喜氣紅 */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: #232528;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Noto Serif TC", "PMingLiU", "MingLiU", "Songti TC", serif;
      padding: 10px;
      overflow-x: hidden;
    }

    .calendar-wrapper {
      width: 100%;
      max-width: 410px;
      position: relative;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.55));
    }

    /* 紅色吊板 */
    .header-board {
      background: linear-gradient(180deg, #e3241f 0%, #c41612 100%);
      height: 82px;
      border-radius: 6px 6px 2px 2px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      z-index: 5;
    }

    .hang-hole {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #232528;
      border: 2px solid #b59a5b;
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
    }

    .header-slogan {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: var(--gold-text);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 1px 2px rgba(90, 0, 0, 0.75);
      cursor: pointer;
    }

    .rivet {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8dc, #bfa054 65%, #6e5623 100%);
      position: absolute;
      bottom: 7px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .rivet.left { left: 22%; }
    .rivet.right { right: 22%; }

    /* 紙張疊層區 */
    .pad-container {
      position: relative;
      margin: 0 12px;
      background: var(--paper-edge);
      padding-bottom: 6px;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 4px 0 #d5d0be, 0 8px 0 #c2bca8;
    }

    .sheet {
      background: var(--paper);
      background-image: radial-gradient(rgba(0,0,0,0.025) 1px, transparent 0);
      background-size: 12px 12px;
      color: var(--ink);
      padding: 0 10px 12px;
      position: relative;
      transform-origin: top center;
      transition: color 0.25s ease;
      cursor: pointer;
    }

    .tear-perforation {
      height: 16px;
      border-bottom: 1.5px dashed var(--ink);
      margin: 0 -10px 8px;
      position: relative;
      opacity: 0.75;
    }
    .tear-perforation::before,
    .tear-perforation::after {
      content: "";
      position: absolute;
      bottom: -4px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #232528;
    }
    .tear-perforation::before { left: -4px; }
    .tear-perforation::after { right: -4px; }

    .sheet.tearing {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: none;
      animation: tearOff 0.65s cubic-bezier(0.32, 0.05, 0.55, 1) forwards;
      box-shadow: 0 18px 25px rgba(0,0,0,0.25);
    }

    @keyframes tearOff {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      30% { transform: translateY(16px) rotate(-2.5deg) scale(0.99); opacity: 1; }
      100% { transform: translateY(240px) rotate(14deg) scale(0.92); opacity: 0; }
    }

    /* 主版面三欄 */
    .main-grid {
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      gap: 2px;
      align-items: stretch;
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .roc-year {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: -0.4px;
      white-space: nowrap;
      margin-bottom: 3px;
    }

    .mini-cal {
      width: 100%;
      border: 1px solid var(--ink);
      font-family: sans-serif;
      font-size: 7px;
      text-align: center;
      margin-bottom: 8px;
      border-collapse: collapse;
    }
    .mini-cal th {
      background: var(--ink);
      color: var(--paper);
      font-weight: 700;
      padding: 1px 0;
    }
    .mini-cal td {
      padding: 1px 0;
      line-height: 1.15;
    }
    .mini-cal td.today-dot {
      background: var(--ink);
      color: var(--paper);
      border-radius: 50%;
      font-weight: 900;
    }

    .lunar-badge {
      background: var(--ink);
      color: var(--paper);
      font-size: 11.5px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 10px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .lunar-vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.05;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 中欄：超大高瘦雙線條日期 */
    .col-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .big-number-box {
      width: 100%;
      height: 256px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .big-number-box svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .weekday-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }

    .weekday-text {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.1;
    }

    .holiday-badge {
      background: var(--ink);
      color: var(--paper);
      font-size: 12px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      display: none;
    }
    .holiday-badge.show {
      display: inline-block;
    }

    /* 右欄 */
    .west-year {
      font-family: "Arial Black", sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.3px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .month-badge {
      width: 48px;
      height: 42px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-family: sans-serif;
    }
    .month-badge .m-zh {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.05;
    }
    .month-badge .m-en {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1px;
      border-top: 1px solid rgba(255,255,255,0.6);
      padding-top: 1px;
      margin-top: 1px;
    }

    .tip-vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 9px;
      line-height: 1.3;
      height: 195px;
      overflow: hidden;
      letter-spacing: 0.3px;
      font-weight: 600;
    }

    /* 黃曆宜忌與節氣列 */
    .almanac-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 6px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1.5px solid var(--ink);
      font-size: 10px;
    }

    .almanac-box {
      border: 1px solid var(--ink);
      padding: 3px 5px;
      line-height: 1.4;
    }

    .tag-inv {
      background: var(--ink);
      color: var(--paper);
      font-weight: 900;
      padding: 0 3px;
      margin-right: 3px;
      display: inline-block;
    }

    .solar-highlight {
      font-weight: 900;
      text-decoration: underline;
    }

    /* 底部吉語／記事欄 */
    .ad-box {
      margin-top: 8px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      min-height: 72px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      transition: background 0.2s;
    }

    .ad-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .ad-sub {
      font-size: 11px;
      opacity: 0.88;
      letter-spacing: 1px;
    }

    /* 底部操作列 */
    .control-bar {
      margin-top: 12px;
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      color: #f2efe9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12.5px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .btn:active { background: rgba(255, 255, 255, 0.28); }

    /* 設定彈窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.68);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      color: #222;
      width: 100%;
      max-width: 350px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 18px;
      font-family: sans-serif;
    }
    .modal h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    .section-box {
      background: #f5f7fa;
      border: 1px solid #e1e5ec;
      border-radius: 10px;
      padding: 11px;
    }
    .field { margin-bottom: 9px; }
    .field label { display: block; font-size: 12px; color: #444; margin-bottom: 3px; font-weight: 600; }
    .field input, .field select {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      user-select: text;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .modal-actions button {
      padding: 8px 15px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-save { background: #0e3570; color: #fff; }
  </style>
</head>
<body>

  <div class="calendar-wrapper">
    <div class="header-board" id="headerBoard" title="點擊可修改吊板祝賀詞">

    <div class="pad-container" id="padContainer">

        <div class="main-grid">

        <div class="almanac-row">

        <div class="ad-box" id="adBox" title="點擊可自訂底部字樣">

          <div class="ad-sub" id="adSubDisplay">平安順心・日日是好日</div>
        </div>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <button class="btn" id="prevBtn">◀ 前一日</button>
    <button class="btn" id="todayBtn">回到今日</button>
    <button class="btn" id="tearBtn">撕下一頁 ▶</button>
    <button class="btn" id="settingsBtn">⚙️ 設定</button>
  </div>

  <!-- 設定彈窗 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>
        <span>𓃥 白六日曆設定</span>
        <span style="font-size:12px;color:#64748b;cursor:pointer;" id="closeXBtn">✕</span>

      <div class="section-box">
        <div class="field">

        </div>
        <div class="field">
          <label>紅色吊板字樣（建議4字）</label>
          <input type="text" id="sloganInput" maxlength="8" placeholder="萬事如意" />
        </div>
        <div class="field">

        </div>
        <div class="field" style="margin-bottom:0;">
          <label>印刷單色模式</label>
          <select id="colorModeSelect">
            <option value="auto">傳統自動（平日藍／週日及放假日紅）</option>
            <option value="blue">全單色普魯士藍</option>
            <option value="red">全單色喜氣紅</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="cancelModalBtn">取消</button>
        <button type="button" class="btn-save" id="saveModalBtn">儲存套用</button>
      </div>
    </div>
  </div>

      "【節氣調養】早晚溫差變化大，注意頭頸與足部保暖，睡前溫水泡腳助眠安神。",
      "【養生茶飲】紅棗桂圓茶：去核紅棗三顆、桂圓肉五粒，熱水悶泡十分鐘，溫潤補氣暖身心。",
      "【處世箴言】心寬一寸，路寬一丈；常懷感恩之心，福氣自然常伴左右。",
      "【養生食療】山藥蓮子粥：健脾胃、益腎氣，口感綿密溫和，四季皆宜之家庭滋補佳品。",
      "【居家小識】室內適度通風換氣，保持陽光充足，綠植點綴案頭更添生機。"
    ];

    let currentDate = new Date();
    let config = JSON.parse(localStorage.getItem("white6_calendar_cfg") || "{}");
    config = {
      slogan: config.slogan || "萬事如意",
      adTitle: config.adTitle || "𓃥 白六每日好心情",
      adSub: config.adSub || "平安順心・日日是好日",
      colorMode: config.colorMode || "auto"
    };

    function formatDateKey(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function playTearSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const duration = 0.28;
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const env = Math.sin((i / bufferSize) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * 0.45;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1400, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(3200, ctx.currentTime + duration);
        filter.Q.value = 1.8;
        noise.connect(filter);
        filter.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function toLunarDayShort(dayNum) {
      if (dayNum === 10) return "初十";
      if (dayNum === 20) return "二十";
      if (dayNum === 30) return "三十";
      if (dayNum < 10) return "初" + CN_NUMS[dayNum];
      if (dayNum < 20) return "十" + CN_NUMS[dayNum - 10];
      return "廿" + CN_NUMS[dayNum - 20];
    }

    function parseLunarDayValue(raw) {
      if (!raw) return 1;
      const numMatch = raw.match(/\d+/);
      if (numMatch) return parseInt(numMatch[0], 10);

      const clean = raw.replace("日", "").trim();
      const map = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
      if (clean === "初十") return 10;
      if (clean === "二十") return 20;
      if (clean === "三十") return 30;
      if (clean.startsWith("初")) return map[clean[1]] || 1;
      if (clean.startsWith("十")) return 10 + (map[clean[1]] || 0);
      if (clean.startsWith("廿")) return 20 + (map[clean[1]] || 0);
      return 1;
    }

    function getLunarInfo(date) {
      try {
        const enFmt = new Intl.DateTimeFormat("en-u-ca-chinese", {
          year: "numeric", month: "numeric", day: "numeric"
        });
        const parts = enFmt.formatToParts(date);
        let relYear = date.getFullYear();
        let rawMonth = "1";
        let rawDay = "1";

        parts.forEach(p => {
          if (p.type === "relatedYear" || p.type === "year") relYear = parseInt(p.value, 10) || relYear;
          if (p.type === "month") rawMonth = p.value;
          if (p.type === "day") rawDay = p.value;
        });

        const isLeap = rawMonth.includes("bis");
        const monthNum = parseInt(rawMonth.replace(/\D/g, ""), 10) || 1;
        const dayNum = parseLunarDayValue(rawDay);

        const gzIdx = (((relYear - 4) % 60) + 60) % 60;
        const ganZhi = STEMS[gzIdx % 10] + BRANCHES[gzIdx % 12];
        const monthStr = (isLeap ? "閏" : "") + (LUNAR_MONTH_NAMES[monthNum] || "正月");
        const dayShort = toLunarDayShort(dayNum);

        const test30 = new Date(date.getFullYear(), date.getMonth(), date.getDate() + (30 - dayNum));
        const testMonth = (enFmt.formatToParts(test30).find(p => p.type === "month") || {}).value;
        const isBig = testMonth === rawMonth;

        return {
          ganZhi, monthStr, monthNum, dayNum, dayShort,
          dayFull: dayShort + "日",
          size: isBig ? "農大" : "農小"
        };
      } catch (e) {
        return { ganZhi: "丙午", monthStr: "十月", monthNum: 10, dayNum: 17, dayShort: "十七", dayFull: "十七日", size: "農大" };
      }
    }

    function getAlmanacInfo(date, lunarMonthNum) {
      const baseUtc = Date.UTC(2024, 0, 1);
      const targetUtc = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      const diffDays = Math.round((targetUtc - baseUtc) / 86400000);
      const gzIndex = ((diffDays % 60) + 60) % 60;

      const stem = STEMS[gzIndex % 10];
      const branchIdx = gzIndex % 12;
      const branch = BRANCHES[branchIdx];

      const monthBranchIdx = (lunarMonthNum + 1) % 12;
      const jianChuIdx = (branchIdx - monthBranchIdx + 12) % 12;
      const rule = JIAN_CHU_RULES[jianChuIdx];

      return {
        dayGz: `${stem}${branch}日`,
        starName: `${rule.name}日`,
        yi: rule.yi,
        ji: rule.ji,
        chong: ZODIAC_CHONG[branchIdx]
      };
    }

    function getYearSolarTerms(year) {
      const y = year - 2000;
      return SOLAR_TERMS.map((st, idx) => {
        const lAdj = idx < 2 ? Math.floor((y - 1) / 4) : Math.floor(y / 4);
        let day = Math.floor(y * 0.2422 + st.c) - lAdj;
        if (year === 2026 && st.name === "雨水") day = 18;
        const dObj = new Date(year, st.month - 1, day);
        return { name: st.name, date: dObj };
      });
    }

    function getSolarTermDisplay(date) {
      const y = date.getFullYear();
      const terms = [...getYearSolarTerms(y), ...getYearSolarTerms(y + 1)];
      const todayStart = new Date(y, date.getMonth(), date.getDate()).getTime();

      for (const t of terms) {
        const tTime = t.date.getTime();
        if (tTime === todayStart) {
          return { text: `今日【${t.name}】`, isToday: true };
        }
        if (tTime > todayStart) {
          const lInfo = getLunarInfo(t.date);
          return { text: `${lInfo.dayShort}${t.name}`, isToday: false };
        }
      }
      return { text: "冬至", isToday: false };
    }

    function getTaiwanHoliday(date, lunar, solarTermObj) {
      const m = date.getMonth() + 1;
      const d = date.getDate();
      const key = `${m}-${d}`;

      const solarHolidays = {
        "1-1": "元旦開國紀念日",
        "2-28": "和平紀念日",
        "4-4": "兒童節",
        "5-1": "勞動節",
        "9-28": "教師節",
        "10-10": "國慶日",
        "10-25": "台灣光復節",
        "12-25": "行憲紀念日"
      };
      if (solarHolidays[key]) return solarHolidays[key];
      if (solarTermObj.isToday && solarTermObj.text.includes("清明")) return "民族掃墓節";

      if (lunar.monthNum === 1 && lunar.dayNum === 1) return "春節初一";
      if (lunar.monthNum === 1 && lunar.dayNum === 2) return "春節初二";
      if (lunar.monthNum === 1 && lunar.dayNum === 3) return "春節初三";
      if (lunar.monthNum === 5 && lunar.dayNum === 5) return "端午節";
      if (lunar.monthNum === 8 && lunar.dayNum === 15) return "中秋節";

      const tomorrow = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1);
      const tmrLunar = getLunarInfo(tomorrow);
      if (tmrLunar.monthNum === 1 && tmrLunar.dayNum === 1) return "農曆除夕";

      return null;
    }

    function renderBigNumberSVG(dayNum) {
      const text = String(dayNum);
      const isTwoDigits = text.length > 1;
      const fontSize = isTwoDigits ? 148 : 162;
      const scaleX = isTwoDigits ? 0.92 : 1.15;

      return `
        <svg viewBox="0 0 210 250" preserveAspectRatio="xMidYMid meet">
          <g transform="translate(105, 128) scale(${scaleX}, 1.62)">
            <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
              font-family="'Arial Black', 'Impact', sans-serif"
              font-weight="900" font-size="${fontSize}"
              fill="var(--ink)" stroke="var(--ink)" stroke-width="12" stroke-linejoin="round">${text}</text>
            <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
              font-family="'Arial Black', 'Impact', sans-serif"
              font-weight="900" font-size="${fontSize}"
              fill="var(--paper)" stroke="var(--paper)" stroke-width="6" stroke-linejoin="round">${text}</text>
            <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
              font-family="'Arial Black', 'Impact', sans-serif"
              font-weight="900" font-size="${fontSize}"
              fill="var(--ink)">${text}</text>
          </g>
        </svg>
      `;
    }

    function renderMiniCalendar(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const todayDate = date.getDate();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = `<thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead><tbody><tr>`;
      for (let i = 0; i < firstDay; i++) html += `<td></td>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const cls = d === todayDate ? ` class="today-dot"` : "";
        html += `<td${cls}>${d}</td>`;
        if ((firstDay + d) % 7 === 0 && d !== daysInMonth) html += `</tr><tr>`;
      }
      const rem = (firstDay + daysInMonth) % 7;
      if (rem !== 0) {
        for (let i = rem; i < 7; i++) html += `<td></td>`;
      }
      html += `</tr></tbody>`;
      document.getElementById("miniCal").innerHTML = html;
    }

    function renderCalendar(date) {
      const y = date.getFullYear();
      const m = date.getMonth();
      const d = date.getDate();
      const dow = date.getDay();

      const lunar = getLunarInfo(date);
      const solarTermObj = getSolarTermDisplay(date);
      const holidayName = getTaiwanHoliday(date, lunar, solarTermObj);
      const almanac = getAlmanacInfo(date, lunar.monthNum);

      const isRedDay = config.colorMode === "red" || (config.colorMode === "auto" && (dow === 0 || Boolean(holidayName)));
      document.body.classList.toggle("is-red-day", isRedDay);

      document.getElementById("sloganDisplay").innerHTML = [...config.slogan].map(ch => `<span>${ch}</span>`).join("");

      const rocYear = y - 1911;
      document.getElementById("rocYearText").textContent = `${rocYear}年 歲次${lunar.ganZhi}`;
      document.getElementById("lunarSizeBadge").textContent = lunar.size;
      document.getElementById("lunarDateText").textContent = `${lunar.monthStr}${lunar.dayFull}`;
      renderMiniCalendar(date);

      document.getElementById("bigNumberSvg").innerHTML = renderBigNumberSVG(d);
      document.getElementById("weekdayText").textContent = WEEKDAYS_ZH[dow];

      const badgeEl = document.getElementById("holidayBadge");
      if (holidayName) {
        badgeEl.textContent = holidayName;
        badgeEl.classList.add("show");
      } else {
        badgeEl.classList.remove("show");
      }

      document.getElementById("westYearText").textContent = y;
      document.getElementById("monthZhText").textContent = `${m + 1}月`;
      document.getElementById("monthEnText").textContent = MONTH_EN[m];

      const daySeed = Math.floor(date.getTime() / 86400000);
      document.getElementById("dailyTipText").textContent = DAILY_TIPS[Math.abs(daySeed) % DAILY_TIPS.length];

      document.getElementById("yiText").textContent = almanac.yi;
      document.getElementById("jiText").textContent = almanac.ji;
      document.getElementById("dayGzBadge").textContent = `${almanac.dayGz}・${almanac.starName}`;
      document.getElementById("chongText").textContent = almanac.chong;

      const solarEl = document.getElementById("solarTermText");
      solarEl.textContent = solarTermObj.text;
      solarEl.classList.toggle("solar-highlight", solarTermObj.isToday);

      document.getElementById("adTitleDisplay").textContent = config.adTitle;
      document.getElementById("adSubDisplay").textContent = config.adSub;
    }

    // ==================== 撕紙動畫與互動 ====================
    let isAnimating = false;
    function tearToNextDay() {
      if (isAnimating) return;
      isAnimating = true;
      playTearSound();

      const pad = document.getElementById("padContainer");
      const activeSheet = document.getElementById("activeSheet");

      const flyingSheet = activeSheet.cloneNode(true);
      flyingSheet.removeAttribute("id");
      flyingSheet.classList.add("tearing");
      pad.appendChild(flyingSheet);

      currentDate.setDate(currentDate.getDate() + 1);
      renderCalendar(currentDate);

      setTimeout(() => {
        flyingSheet.remove();
        isAnimating = false;
      }, 660);
    }

    document.getElementById("tearBtn").addEventListener("click", tearToNextDay);
    document.getElementById("prevBtn").addEventListener("click", () => {
      currentDate.setDate(currentDate.getDate() - 1);
      renderCalendar(currentDate);
    });
    document.getElementById("todayBtn").addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar(currentDate);
    });

    document.getElementById("adBox").addEventListener("click", (e) => {
      e.stopPropagation();
      openSettings();
    });
    document.getElementById("adBox").addEventListener("touchend", (e) => {
      e.stopPropagation();
      openSettings();
    });

    let touchStartY = 0;
    const activeSheetEl = document.getElementById("activeSheet");
    activeSheetEl.addEventListener("touchstart", e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    activeSheetEl.addEventListener("touchend", e => {
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (dy > 35 || Math.abs(dy) < 8) tearToNextDay();
    });
    activeSheetEl.addEventListener("click", e => {
      if (e.pointerType === "mouse") tearToNextDay();
    });

    const modalBackdrop = document.getElementById("modalBackdrop");
    function openSettings() {
      document.getElementById("datePicker").value = formatDateKey(currentDate);
      document.getElementById("sloganInput").value = config.slogan;
      document.getElementById("adTitleInput").value = config.adTitle;
      document.getElementById("adSubInput").value = config.adSub;
      document.getElementById("colorModeSelect").value = config.colorMode;
      modalBackdrop.classList.add("open");
    }

    document.getElementById("settingsBtn").addEventListener("click", openSettings);
    document.getElementById("headerBoard").addEventListener("click", openSettings);
    document.getElementById("cancelModalBtn").addEventListener("click", () => modalBackdrop.classList.remove("open"));
    document.getElementById("closeXBtn").addEventListener("click", () => modalBackdrop.classList.remove("open"));

    document.getElementById("saveModalBtn").addEventListener("click", () => {
      const picked = document.getElementById("datePicker").value;
      if (picked) {
        const [py, pm, pd] = picked.split("-").map(Number);
        currentDate = new Date(py, pm - 1, pd);
      }
      config.slogan = document.getElementById("sloganInput").value.trim() || "萬事如意";
      config.adTitle = document.getElementById("adTitleInput").value.trim() || "𓃥 白六每日好心情";
      config.adSub = document.getElementById("adSubInput").value.trim() || "平安順心・日日是好日";
      config.colorMode = document.getElementById("colorModeSelect").value;

      localStorage.setItem("white6_calendar_cfg", JSON.stringify(config));
      renderCalendar(currentDate);
      modalBackdrop.classList.remove("open");
    });

    renderCalendar(currentDate);
  </script>
